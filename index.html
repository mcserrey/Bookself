<style>
:root{
  --ink:#16100b; --ink2:#221810;
  --gold:#d9ad55; --gold-hi:#f4d98f; --gold-lo:#a87a2c;
  --oak:#c98b4f; --oak-hi:#e6b479; --oak-lo:#9a5f2c; --oak-edge:#f0c48c;
  --walnut:#5b361a; --walnut-lo:#3a2211; --walnut-hi:#7a4a25;
  --back:#2c1b10; --back2:#352113;
  --paper:#f6ead2; --text:#f3e6cc; --muted:#b9a27f;
  --danger:#c4553f;

  --cw: clamp(44px, calc((100vw - 64px) / 6.4), 82px);   /* ទទឹងក្របសៀវភៅ */
  --ch: calc(var(--cw) * 1.42);
  --plank: 15px;
  --row: calc(var(--ch) + var(--plank) + 12px);
  --gap: clamp(6px, 1.6vw, 12px);
}
@media (min-width:900px){ :root{ --cw: clamp(60px, calc((100vw - 140px) / 12), 86px); } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);
  font-family:'Noto Sans Khmer',system-ui,sans-serif;min-height:100%}
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(217,173,85,.12), transparent 60%),
    radial-gradient(900px 600px at 50% 120%, rgba(120,70,30,.25), transparent 60%),
    var(--ink);
  padding:0 0 calc(40px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg, rgba(22,16,11,.97), rgba(22,16,11,.88));
  backdrop-filter:blur(8px);border-bottom:1px solid rgba(217,173,85,.18)}
.hrow{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.brand{flex:1;min-width:0}
.logo{width:48px;height:48px;border-radius:50%;flex:none;display:block;background:#0f3b2a;
  box-shadow:0 0 0 1px rgba(217,173,85,.45),0 4px 14px rgba(0,0,0,.55),0 0 18px rgba(217,173,85,.15)}
@media (min-width:640px){.logo{width:54px;height:54px}}
.brand h1{margin:0;font-family:'Noto Serif Khmer',serif;font-weight:700;font-size:21px;line-height:1.5;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.2px}
.brand h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:1.15;letter-spacing:.5px}
.brand .motto{display:block;font-family:'Noto Serif Khmer',serif;font-size:12px;font-weight:600;line-height:1.9;letter-spacing:0;color:var(--muted);-webkit-text-fill-color:var(--gold-lo)}
@media (min-width:640px){.brand .motto{display:inline;margin-left:10px;font-size:13px}}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6fbf73;margin-right:5px;vertical-align:middle;box-shadow:0 0 6px #6fbf73}
.dot.busy{background:var(--gold);box-shadow:0 0 6px var(--gold);animation:pulse 1s infinite}
.dot.err{background:var(--danger);box-shadow:0 0 6px var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.ibtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(180deg,#2c2016,#1d150e);border:1px solid rgba(217,173,85,.28);color:var(--gold-hi)}
.ibtn:active{transform:scale(.95)}
.ibtn svg{width:19px;height:19px}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.search{max-width:1180px;margin:8px auto 0;display:none}
.search.on{display:block}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(217,173,85,.3);
  background:#120d09;color:var(--text);font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--gold)}

/* ---------- Cabinet ---------- */
.cabinet{max-width:1180px;margin:18px auto 0;padding:0 10px}
.crown{height:26px;margin:0 -4px;border-radius:6px 6px 2px 2px;position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), transparent 30%, rgba(0,0,0,.25) 70%, rgba(0,0,0,.45)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 7px, rgba(255,255,255,.04) 7px 9px, transparent 9px 15px),
    linear-gradient(90deg,var(--walnut-lo),var(--walnut-hi) 20%,var(--walnut) 50%,var(--walnut-hi) 80%,var(--walnut-lo));
  box-shadow:0 8px 18px rgba(0,0,0,.55)}
.crown::after{content:"";position:absolute;left:8px;right:8px;bottom:-6px;height:6px;border-radius:0 0 4px 4px;
  background:linear-gradient(180deg,var(--walnut),var(--walnut-lo))}
.frame{padding:14px 12px 0;border-radius:0 0 6px 6px;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 3px, transparent 3px 11px, rgba(255,255,255,.03) 11px 13px, transparent 13px 22px),
    linear-gradient(90deg,var(--walnut-lo),var(--walnut-hi) 2.5%,var(--walnut) 5%,var(--walnut) 95%,var(--walnut-hi) 97.5%,var(--walnut-lo));
  box-shadow:0 20px 40px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.4)}
.plinth{height:22px;margin:0 -4px;border-radius:2px 2px 6px 6px;
  background:linear-gradient(180deg,var(--walnut-hi),var(--walnut) 40%,var(--walnut-lo));
  box-shadow:0 14px 26px rgba(0,0,0,.6)}

.shelf{position:relative;margin-bottom:14px;border-radius:3px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55), transparent 22px),
    linear-gradient(90deg, rgba(0,0,0,.45), transparent 18px, transparent calc(100% - 18px), rgba(0,0,0,.45)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 9px, rgba(0,0,0,.06) 9px 11px, transparent 11px 23px, rgba(255,255,255,.02) 23px 24px, transparent 24px 37px),
    linear-gradient(180deg,var(--back2),var(--back));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.shelf.drop{outline:2px dashed var(--gold);outline-offset:-4px}

.plate-row{display:flex;justify-content:center;align-items:center;padding:12px 10px 4px;gap:8px;position:relative}
.plate{position:relative;display:inline-flex;align-items:center;gap:8px;max-width:78%;
  padding:5px 16px 5px 16px;border-radius:5px;
  font-family:'Noto Serif Khmer',serif;font-weight:600;font-size:13.5px;color:#3a2307;line-height:1.55;
  background:linear-gradient(180deg,#fbe7a8 0%,#e3bc62 38%,#c4933d 60%,#e8c674 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.25);
  text-shadow:0 1px 0 rgba(255,240,200,.6)}
/* ---------- Hero: សៀវភៅដើរ ---------- */
.hero{max-width:1180px;margin:16px auto 0;padding:0 10px;--hw:calc(var(--cw) * .92)}
.hero:empty,.reading:empty{display:none}
.hero-in{position:relative;overflow:hidden;border-radius:14px;
  background:
    radial-gradient(600px 160px at 50% 0%, rgba(244,217,143,.22), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 13px, rgba(0,0,0,.07) 13px 15px, transparent 15px 31px),
    linear-gradient(180deg,#3a2414,#22150c);
  border:1px solid rgba(217,173,85,.28);box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,150,.12)}
.hero-cap{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 18px 2px}
.hero-cap h2{margin:0;font-family:'Noto Serif Khmer',serif;font-weight:600;font-size:17px;line-height:1.6;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-cap span{font-size:12px;color:var(--muted)}
.track{position:relative;overflow:hidden;padding-top:16px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.marq{display:flex;width:max-content;animation:marq var(--dur,60s) linear infinite}
.hero-in:hover .marq{animation-play-state:paused}
@keyframes marq{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.mbook{--cw:var(--hw);flex:none;width:var(--hw);margin-right:calc(var(--gap) + 6px);display:block;padding:0}
.mbook .cover{height:calc(var(--hw) * 1.42);animation:bob 1.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.mbook:hover .cover{transform:translateY(-8px) scale(1.04);animation-play-state:paused}
@keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-5px) rotate(1deg)}}
.rail{height:13px;margin-top:-1px;
  background:linear-gradient(180deg,var(--oak-edge),var(--oak-hi) 2px,var(--oak) 6px,var(--oak-lo) 11px,#5e3818);
  box-shadow:0 6px 10px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.marq,.mbook .cover{animation:none}}

/* ---------- កំពុងអាន ---------- */
.reading{max-width:1180px;margin:20px auto 0;padding:0 10px;--rw:calc(var(--cw) * 1.2)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 6px 12px;font-family:'Noto Serif Khmer',serif;font-weight:600;font-size:16px;color:var(--gold-hi)}
.sec-h svg{width:18px;height:18px;flex:none}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(217,173,85,.5),transparent)}
.sec-h b{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--muted);font-weight:600}
.rlist{display:flex;gap:16px;overflow-x:auto;padding:8px 6px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.ritem{--cw:var(--rw);flex:none;position:relative;width:var(--rw);scroll-snap-align:start;text-decoration:none;color:inherit}
.ritem .cover{height:calc(var(--rw) * 1.42)}
.ritem:hover .cover{transform:translateY(-4px)}
.ritem .t{font-size:12px;line-height:1.55;margin-top:7px;color:var(--paper);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .x{position:absolute;top:-7px;right:-7px;z-index:5;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:#2b1f14;border:1px solid rgba(217,173,85,.5);color:var(--gold-hi);font-size:13px;line-height:1}
.ritem .bm{position:absolute;top:-3px;left:10px;z-index:4;width:12px;height:22px;background:linear-gradient(180deg,#b3352c,#7e1f19);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.rempty{margin:0 6px;padding:16px;border-radius:12px;border:1px dashed rgba(217,173,85,.3);color:var(--muted);font-size:13px;text-align:center;line-height:1.8}

.plate{cursor:pointer;user-select:none}
.plate .chev{width:11px;height:11px;flex:none;opacity:.65;transition:transform .2s}
.shelf.closed .plate .chev{transform:rotate(-90deg)}
.shelf.closed .books{display:none}
.shelf.closed .plate-row{padding-bottom:10px}
.shelf.closed::after{content:"";display:block;height:var(--plank);border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,var(--oak-edge),var(--oak-hi) 2px,var(--oak) 6px,var(--oak-lo) calc(100% - 2px),#5e3818)}
.book.over{display:none}
.more{width:var(--cw);height:var(--row);padding:12px 0 var(--plank);display:flex;align-items:flex-end}
.more[hidden]{display:none}
.more span{width:100%;height:var(--ch);display:grid;place-items:center;align-content:center;gap:4px;border-radius:3px 5px 5px 3px;
  border:1.5px dashed rgba(217,173,85,.55);background:rgba(0,0,0,.28);color:var(--gold-hi);transition:.2s}
.more b{font:600 calc(var(--cw) * .32)/1 'Cormorant Garamond',serif}
.more small{font-size:10.5px;color:var(--muted);line-height:1.3;text-align:center;padding:0 3px}
.more:hover span{background:rgba(217,173,85,.12);border-color:var(--gold)}
.plate::before,.plate::after{content:"";width:5px;height:5px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 35%,#fff3c9,#8a6220 70%);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.plate span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:14px;opacity:.75}
.smenu{position:absolute;right:10px;top:12px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--gold-hi);background:rgba(0,0,0,.28);border:1px solid rgba(217,173,85,.22)}
.smenu svg{width:16px;height:16px}

.books{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:var(--gap);
  padding:0 clamp(12px,3vw,26px);min-height:var(--row);
  background:repeating-linear-gradient(180deg,
    transparent 0, transparent calc(var(--row) - var(--plank) - 1px),
    rgba(0,0,0,.55) calc(var(--row) - var(--plank) - 1px),
    var(--oak-edge) calc(var(--row) - var(--plank)),
    var(--oak-hi) calc(var(--row) - var(--plank) + 2px),
    var(--oak) calc(var(--row) - var(--plank) + 6px),
    var(--oak-lo) calc(var(--row) - 2px),
    #5e3818 var(--row));
}
.empty{width:100%;height:var(--row);display:grid;place-items:center;padding-bottom:var(--plank);
  color:rgba(243,230,204,.38);font-size:13px;font-style:italic}

/* ---------- Book ---------- */
.book{position:relative;width:var(--cw);height:var(--row);padding:12px 0 var(--plank);display:flex;align-items:flex-end}
.cover{position:relative;width:100%;height:var(--ch);border-radius:2px 5px 5px 2px;overflow:hidden;
  background:#3b2a1e center/cover no-repeat;
  box-shadow:3px 3px 6px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .25s; transform-origin:bottom center}
.cover::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg, rgba(0,0,0,.45) 0, rgba(255,255,255,.28) 3px, rgba(0,0,0,.18) 6px, transparent 11px, transparent 85%, rgba(255,255,255,.1)),
             linear-gradient(180deg, rgba(255,255,255,.12), transparent 25%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.cover img.ok{opacity:1}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:6px 10px 14px rgba(0,0,0,.6)}
.book:active .cover{transform:translateY(-3px) scale(.98)}
.book.dim{opacity:.18;filter:grayscale(.7)}
.book.hit .cover{box-shadow:0 0 0 2px var(--gold-hi),0 0 16px rgba(244,217,143,.7)}
.book.dragging{opacity:.35}

/* leather fallback cover */
.leather{position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,.14), transparent 55%),
    repeating-radial-gradient(circle at 40% 60%, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
    var(--lc);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.18), inset 0 0 0 4px rgba(217,173,85,.75), inset 0 0 0 6px rgba(0,0,0,.2), inset 0 0 0 7px rgba(217,173,85,.45)}
.leather i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;
  color:rgba(244,217,143,.85);font-size:calc(var(--cw) * .32);font-family:'Cormorant Garamond',serif;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.leather u{position:absolute;left:22%;right:22%;height:1px;background:rgba(244,217,143,.6);text-decoration:none}
.leather u:nth-of-type(1){top:24%} .leather u:nth-of-type(2){bottom:24%}
.ext{position:absolute;right:3px;bottom:3px;z-index:3;font:600 8px/1 'Cormorant Garamond',serif;letter-spacing:.5px;
  color:#f4d98f;background:rgba(0,0,0,.55);padding:2px 3px;border-radius:2px;text-transform:uppercase}

/* ---------- Sheet / Modal ---------- */
.veil{position:fixed;inset:0;z-index:50;background:rgba(8,5,3,.62);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), transparent 120px),
    linear-gradient(180deg,#2a1d13,#1b130c);
  border:1px solid rgba(217,173,85,.25);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.6);
  transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.3,1)}
.veil.on .sheet{transform:none}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid rgba(217,173,85,.25)}}
.grab{width:42px;height:4px;border-radius:4px;background:rgba(217,173,85,.35);margin:-6px auto 14px}
.bk-head{display:flex;gap:14px;align-items:flex-start}
.bk-head .cover{width:92px;height:131px;flex:none;--cw:92px}
.bk-title{font-family:'Noto Serif Khmer',serif;font-weight:600;font-size:16.5px;line-height:1.6;color:var(--paper);word-break:break-word;margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.8}
.meta .mono{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11.5px}
.h2{font-family:'Noto Serif Khmer',serif;font-weight:600;font-size:17px;color:var(--gold-hi);margin:0 0 12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:12px;font-size:14px;
  background:linear-gradient(180deg,#34261a,#241a11);border:1px solid rgba(217,173,85,.25);color:var(--text)}
.btn svg{width:17px;height:17px;flex:none}
.btn.gold{background:linear-gradient(180deg,#f0cf80,#c8963f);color:#2c1906;border-color:#f6dd9d;font-weight:600}
.btn.red{color:#ffb4a4;border-color:rgba(196,85,63,.5)}
.btn.full{grid-column:1/-1}
.btn:active{transform:scale(.98)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.inp,select.inp{width:100%;padding:11px 13px;border-radius:11px;border:1px solid rgba(217,173,85,.3);
  background:#120d09;color:var(--text);font:inherit;font-size:15px;outline:none}
.inp:focus{border-color:var(--gold)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist .btn{justify-content:flex-start}
.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin:4px 0 0}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;
  padding:10px 16px;border-radius:12px;background:#2b1f14;border:1px solid rgba(217,173,85,.4);color:var(--paper);
  font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--danger)}

.loading{padding:60px 0;text-align:center;color:var(--muted)}
.loading .bk{display:inline-flex;gap:5px;margin-bottom:14px}
.loading .bk i{width:12px;height:38px;border-radius:2px;background:var(--oak);animation:lean 1.2s infinite ease-in-out}
.loading .bk i:nth-child(2){background:#7d2f2a;animation-delay:.12s}.loading .bk i:nth-child(3){background:#2f4f46;animation-delay:.24s}
.loading .bk i:nth-child(4){background:var(--gold-lo);animation-delay:.36s}
@keyframes lean{50%{transform:rotate(-12deg) translateY(-3px)}}
.foot{max-width:1180px;margin:14px auto 0;padding:0 16px;font-size:11.5px;color:rgba(185,162,127,.6);text-align:center}
.foot a{color:var(--gold)}
.demo{max-width:1180px;margin:10px auto 0;padding:0 16px}
.demo div{font-size:12px;color:#2c1906;background:var(--gold);border-radius:9px;padding:6px 10px;text-align:center}
</style>
</head>

<header>

  <div class="search" id="searchBox"><input id="q" type="search" placeholder="ស្វែងរកសៀវភៅ…" autocomplete="off"></div>

<div class="demo" id="demoBar" hidden><div>របៀបបង្ហាញគំរូ — ពេលដំណើរការក្នុង Apps Script នឹងបង្ហាញសៀវភៅពិតពី Drive</div></div>

<script>
/* ===================== API (Apps Script Web App) ===================== */
const API_URL   = 'https://script.google.com/macros/s/AKfycbyrYHhMtFKSSmIwLnPmY7OT0b43tXLpLryDFsIcoos6Ukw5Yzny6R-AY7X9NG-rB863/exec';

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const MODE = IN_GAS ? 'gas' : (/[?&]demo\b/.test(location.search) ? 'demo' : 'api');

function call(fn, ...args){
  if (MODE === 'demo') return DEMO[fn](...args);
  if (MODE === 'gas')
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
  return fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },      // គ្មាន CORS preflight
      body: JSON.stringify({ token: API_TOKEN, action: fn, args })
    })
    .catch(() => { throw new Error('ភ្ជាប់មិនបាន — សូមពិនិត្យ Internet ឬកំណត់ Web app “Who has access” = Anyone'); })
    .then(r => r.text())
    .then(t => {
      let j; try { j = JSON.parse(t); }
      catch(e){ throw new Error('Web app មិនឆ្លើយ JSON — សូម Deploy “New version” ហើយកំណត់ Who has access = Anyone'); }
      if (!j.ok) throw new Error(j.error);
      return j.data;
    });
}

/* ---------- Demo data (preview only) ---------- */
const DEMO = (() => {
  const mk = (names) => names.map((n,i) => ({ id:'d'+Math.random().toString(36).slice(2,9), name:n, mime:'application/pdf',
    size: (1+i*3.7)*1048576|0, updated:new Date(Date.now()-i*864e5*9).toISOString(), url:'#' }));
  let lib = { rootUrl:'#', rootName:'Books', loose:[], reading:[], shelves:[
    { id:'s1', name:'Dental Books', url:'#', books: mk(['Essensail Orthodontic.pdf','Emerging Nanotechnologies in Dentistry.pdf','How to become a unique dentist.pdf','Treat.pdf','Lasers in Maxillofacial Surgery and Dentistry.pdf','Endodontics Principles.pdf','Oral Pathology Atlas.pdf','Periodontology Handbook.pdf','Pediatric Dentistry.pdf']) },
    { id:'s2', name:'EBooks', url:'#', books: mk(['Atomic Habits.pdf','Deep Work.epub','The Psychology of Money.pdf','Thinking Fast and Slow.pdf','Sapiens.pdf']) },
    { id:'s3', name:'ធម្មសិក្សា', url:'#', books: mk(['ធម្មបទ.pdf','មង្គលសូត្រ.pdf','វិបស្សនា.pdf']) },
    { id:'s4', name:'ឯកសារ', url:'#', books: mk(['របាយការណ៍ប្រចាំឆ្នាំ.pdf','សេចក្ដីណែនាំ.docx']) },
    { id:'s5', name:'ឯកសារ-រដ្ឋបាល', url:'#', books: [] }
  ]};
  const wait = (v) => new Promise(r => setTimeout(() => r(v), 250));
  const findBook = id => { for (const s of [...lib.shelves,{id:ROOT_KEY,books:lib.loose}]) { const i=s.books.findIndex(b=>b.id===id); if(i>-1) return [s,i]; } };
  return {
    getLibrary: () => wait(JSON.parse(JSON.stringify({...lib, syncedAt:new Date().toISOString()}))),
    getCovers: ids => wait(Object.fromEntries(ids.map(i=>[i,null]))),
    addShelf: n => { const s={id:'s'+Date.now(),name:n,books:[],url:'#'}; lib.shelves.push(s); return wait({...s}); },
    renameShelf: (id,n) => { lib.shelves.find(s=>s.id===id).name=n; return wait(true); },
    deleteShelf: (id,to) => { const s=lib.shelves.find(x=>x.id===id); if(to) lib.shelves.find(x=>x.id===to).books.push(...s.books); lib.shelves=lib.shelves.filter(x=>x.id!==id); return wait(true); },
    saveShelfOrder: ids => { lib.shelves.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); return wait(true); },
    renameBook: (id,n) => { const [s,i]=findBook(id); s.books[i].name=n; return wait(true); },
    moveBook: (id,to) => { const [s,i]=findBook(id); const [b]=s.books.splice(i,1); (to?lib.shelves.find(x=>x.id===to).books:lib.loose).push(b); return wait(true); },
    deleteBook: id => { const [s,i]=findBook(id); s.books.splice(i,1); return wait(true); },
    setReading: (id,on) => { lib.reading = lib.reading.filter(x=>x!==id); if (on) lib.reading.unshift(id); return wait([...lib.reading]); },
    uploadBook: (sid,n,m) => { const b={id:'u'+Date.now(),name:n,mime:m,size:0,updated:new Date().toISOString(),url:'#'}; lib.shelves.find(x=>x.id===sid).books.push(b); return wait({...b}); }
  };
})();

const baseName = n => n.replace(/\.[a-z0-9]{2,5}$/i,'');
const extOf = n => (n.match(/\.([a-z0-9]{2,5})$/i)||[])[1] || '';
const fmtSize = b => !b ? '—' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB';
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const kmNum = n => String(n).replace(/\d/g, d => '០១២៣៤៥៦៧៨៩'[d]);

const LEATHER = ['#6e2421','#24443b','#2b3a5c','#5a3a1c','#4a2a4a','#7a5a22','#2e2e2e','#3f5a2a','#6a2e3e','#1f4b5a'];
function hash(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
const allShelves = () => LIB ? [...LIB.shelves, ...(LIB.loose.length ? [{id:ROOT_KEY,name:'លើតុ — មិនទាន់ដាក់ធ្នើ',books:LIB.loose,virtual:true}] : [])] : [];
const shelfOf = id => allShelves().find(s => s.books.some(b => b.id === id));
const bookById = id => { for (const s of allShelves()) { const b = s.books.find(x => x.id === id); if (b) return b; } };

function setStatus(kind, text){
  $('#status').innerHTML = `<span class="dot ${kind}"></span>${esc(text)}`;
}
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2600);
}
async function run(label, fn){
  busy++; setStatus('busy', label + '…'); $('#bSync').classList.add('spin');
  try { const r = await fn(); return r; }
  catch(e){ toast('មានបញ្ហា: ' + (e && e.message || e), true); setStatus('err','Sync មិនបានសម្រេច'); throw e; }
  finally { if (--busy === 0) { $('#bSync').classList.remove('spin'); stamp(); } }
}
function stamp(){
  if (!LIB) return;
  const n = allShelves().reduce((a,s)=>a+s.books.length,0);
  setStatus('', `${kmNum(LIB.shelves.length)} ធ្នើ · ${kmNum(n)} ក្បាល · Sync ${new Date(LIB.syncedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
}

  return `<div class="cover" data-cv="${b.id}">
      <div class="leather" style="--lc:${lc}"><u></u><i>${glyph}</i><u></u></div>
      ${c ? `<img class="ok" src="${c}" alt="">` : ''}
      ${extOf(b.name) && extOf(b.name).toLowerCase()!=='pdf' ? `<span class="ext">${esc(extOf(b.name))}</span>` : ''}
    </div>`;
}

/* ---------- Hero: សៀវភៅដើរពីឆ្វេងទៅស្ដាំ ---------- */
let heroOrder = [];
function shuffleHero(){
  const ids = allShelves().flatMap(s => s.books.map(b => b.id));
  for (let i = ids.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [ids[i], ids[j]] = [ids[j], ids[i]]; }
  heroOrder = ids.slice(0, 24);
}
function renderHero(){
  const el = $('#hero');
  let ids = heroOrder.filter(id => bookById(id));
  if (!ids.length){ el.innerHTML = ''; return; }
  while (ids.length < 12) ids = ids.concat(ids);                  // ឱ្យពេញអេក្រង់
  const one = ids.map(id => { const b = bookById(id);
    return `<button class="mbook" data-hero="${id}" aria-label="${esc(baseName(b.name))}" style="--d:${(-Math.random()*1.4).toFixed(2)}s">${coverHTML(b)}</button>`; }).join('');
  const total = allShelves().reduce((a,s)=>a+s.books.length,0);
  el.innerHTML = `<div class="hero-in">
      <div class="hero-cap"><h2>បណ្ណាល័យរបស់ខ្ញុំ</h2><span>${kmNum(total)} ក្បាល · ${kmNum(LIB.shelves.length)} ធ្នើ</span></div>
      <div class="track"><div class="marq" style="--dur:${ids.length * 3.2}s">${one}${one}</div></div>
      <div class="rail"></div></div>`;
}

  try { LIB.reading = await call('setReading', id, on); }
  catch(e){ LIB.reading = prev; renderReading(); observeCovers(); }
}

/* ---------- Lazy cover loading ---------- */
let io, queue = new Set(), inflight = 0;
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
function observeCovers(){
  if (io) io.disconnect();
  io = new IntersectionObserver(ents => {
    ents.forEach(e => { if (!e.isIntersecting) return;
      const id = e.target.dataset.cv; io.unobserve(e.target);
      if (covers.has(id)) return;
      const cached = LS.get('cv3_' + id);
      if (cached !== null){ covers.set(id, cached || null); paintCover(id); return; }
      queue.add(id); });
    pump();
  }, { rootMargin: '300px' });
  document.querySelectorAll('.books [data-cv], #hero [data-cv], #reading [data-cv]').forEach(el => io.observe(el));
}
async function pump(){
  while (queue.size && inflight < 3){
    const ids = [...queue].slice(0, 4); ids.forEach(i => queue.delete(i)); inflight++;
    call('getCovers', ids).then(res => {
      ids.forEach(id => { const d = res[id] || null; covers.set(id, d); if (d && d.length < 120000) LS.set('cv3_'+id, d); paintCover(id); });
    }).catch(()=>{}).finally(() => { inflight--; pump(); });
  }
}
function paintCover(id){
  const d = covers.get(id); if (!d) return;
  document.querySelectorAll(`[data-cv="${id}"]`).forEach(el => {
    if (el.querySelector('img')) return;
    const img = new Image(); img.alt=''; img.onload = () => img.classList.add('ok'); img.src = d; el.appendChild(img);
  });
}

/* ---------- Search ---------- */
function applySearch(){
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('.book').forEach(el => {
    const b = bookById(el.dataset.book); if (!b) return;
    const m = q && b.name.toLowerCase().includes(q);
    el.classList.toggle('dim', !!q && !m); el.classList.toggle('hit', !!m);
  });
  layoutRows();
}

/* ---------- ២ ជួរ / លាក់ធ្នើ ---------- */
const loadSet = k => { try { return new Set(JSON.parse(LS.get(k) || '[]')); } catch(e){ return new Set(); } };
const OPEN = loadSet('shelfOpenAll'), CLOSED = loadSet('shelfClosed');
const saveSets = () => { LS.set('shelfOpenAll', JSON.stringify([...OPEN])); LS.set('shelfClosed', JSON.stringify([...CLOSED])); };
const MAX_ROWS = 2;

function layoutRows(){
  const searching = !!$('#q').value.trim();
  document.querySelectorAll('.shelf').forEach(sh => {
    const id = sh.dataset.shelf;
    sh.classList.toggle('closed', CLOSED.has(id) && !searching);
    const more = sh.querySelector('.more'); if (!more) return;
    const books = [...sh.querySelectorAll('.book')];
    books.forEach(b => b.classList.remove('over')); more.hidden = true;
    if (sh.classList.contains('closed') || searching || books.length < 2) return;
    const top0 = books[0].offsetTop, per = books.findIndex(b => b.offsetTop !== top0);
    if (per < 1) return;                                   // មានតែ ១ ជួរ
    const limit = per * MAX_ROWS;
    if (books.length <= limit) return;
    more.hidden = false;
    if (OPEN.has(id)){ more.innerHTML = `<span><b>−</b><small>បង្រួម</small></span>`; return; }
    books.slice(limit - 1).forEach(b => b.classList.add('over'));
    more.innerHTML = `<span><b>+${kmNum(books.length - limit + 1)}</b><small>មើលទាំងអស់</small></span>`;
  });
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(layoutRows, 120); });

let lastSync = 0;
async function load(quiet){
  try {
    const lib = await run('កំពុង Sync ជាមួយ Drive', () => call('getLibrary'));
    LIB = lib; LIB.reading = LIB.reading || []; lastSync = Date.now(); shuffleHero(); render(); stamp();
  } catch(e){
    if (!LIB) $('#cab').innerHTML = `<div class="loading">មិនអាចភ្ជាប់ Drive បានទេ<br><small>${esc(e && e.message || e)}</small></div>`;
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSync > 60000 && !busy) load(true); });

function ask({title, label, value='', ok='រក្សាទុក', danger=false, extra=''}){
  return new Promise(res => {
    openSheet(`<h3 class="h2">${esc(title)}</h3>
      ${label ? `<label class="f">${esc(label)}</label><input class="inp" id="askIn" value="${esc(value)}">` : ''}

      <div class="actions"><button class="btn" id="askNo">បោះបង់</button><button class="btn ${danger?'red':'gold'}" id="askOk">${esc(ok)}</button></div>`);
    const inp = $('#askIn'); if (inp){ setTimeout(()=>{ inp.focus(); inp.select(); }, 60); inp.onkeydown = e => { if (e.key==='Enter') $('#askOk').click(); }; }
    $('#askNo').onclick = () => { closeSheet(); res(null); };
    $('#askOk').onclick = () => { const v = inp ? inp.value.trim() : true; const sel = $('#askSel'); closeSheet(); res(inp ? v : (sel ? {sel: sel.value} : true)); };
  });
}

/* ---------- Book sheet ---------- */
function bookSheet(id){
  const b = bookById(id), s = shelfOf(id); if (!b) return;
  const opts = allShelves().filter(x => !x.virtual || x.id === ROOT_KEY).map(x => `<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')
             + (LIB.loose.length ? '' : `<option value="${ROOT_KEY}">លើតុ — មិនទាន់ដាក់ធ្នើ</option>`);
  openSheet(`<div class="bk-head">${coverHTML(b)}
      <div style="min-width:0"><p class="bk-title">${esc(baseName(b.name))}</p>
        <div class="meta">ធ្នើ៖ ${esc(s.name)}<br><span class="mono">${esc(extOf(b.name).toUpperCase()||'FILE')} · ${fmtSize(b.size)} · ${fmtDate(b.updated)}</span></div></div></div>
    <div class="actions">
      <a class="btn gold full" href="${b.url}" target="_blank" rel="noopener" style="text-decoration:none" data-act="open">${I.open}បើកអាន</a>
      <button class="btn full" data-act="toggleRead">${isReading(id) ? '✓ កំពុងអាន — ដកចេញ' : '🔖 ដាក់ក្នុង “កំពុងអាន”'}</button>
      <button class="btn" data-act="renameBook">${I.edit}ប្ដូរឈ្មោះ</button>
      <button class="btn red" data-act="deleteBook">${I.del}លុប</button>
    </div>
    <label class="f">ផ្លាស់ទៅធ្នើ</label>
    <select class="inp" id="mvSel">${opts}</select>`);
  paintCover(id);
  $('#mvSel').onchange = e => moveBook(id, e.target.value);
  $('#sheet').querySelector('[data-act=open]').addEventListener('click', () => { if (!isReading(id) || readingIds()[0] !== id) markReading(id, true); closeSheet(); });
  $('#sheet').querySelector('[data-act=toggleRead]').onclick = () => {
    const on = !isReading(id); markReading(id, on); closeSheet(); toast(on ? 'បានដាក់ក្នុង “កំពុងអាន” ✓' : 'បានដកចេញ ✓'); };
  $('#sheet').querySelector('[data-act=renameBook]').onclick = async () => {
    const ext = extOf(b.name);
    const v = await ask({title:'ប្ដូរឈ្មោះសៀវភៅ', label:'ឈ្មោះថ្មី', value: baseName(b.name)});
    if (!v) return;
    const nn = ext && !v.toLowerCase().endsWith('.'+ext.toLowerCase()) ? v + '.' + ext : v;
    const old = b.name; b.name = nn; render();
    try { await run('កំពុងប្ដូរឈ្មោះ', () => call('renameBook', id, nn)); toast('បានប្ដូរឈ្មោះ ✓'); }
    catch(e){ b.name = old; render(); }
  };
  $('#sheet').querySelector('[data-act=deleteBook]').onclick = async () => {
    const ok = await ask({title:'លុបសៀវភៅនេះ?', ok:'លុប', danger:true,
      extra:`<p class="note">“${esc(baseName(b.name))}” នឹងទៅក្នុងធុងសំរាម (Trash) របស់ Google Drive — អាចស្ដារវិញបានក្នុងរយៈពេល ៣០ ថ្ងៃ។</p>`});
    if (!ok) return;
    const sh = shelfOf(id), i = sh.books.indexOf(b); sh.books.splice(i,1); render();
    try { await run('កំពុងលុប', () => call('deleteBook', id)); toast('បានលុប ✓'); }
    catch(e){ sh.books.splice(i,0,b); render(); }
  };
}

async function moveBook(id, toId){
  const from = shelfOf(id); if (!from || from.id === toId) return;
  const b = bookById(id);
  from.books.splice(from.books.indexOf(b),1);
  const dest = toId === ROOT_KEY ? LIB.loose : LIB.shelves.find(s => s.id === toId).books;
  dest.push(b); dest.sort((a,c)=>a.name.localeCompare(c.name));
  closeSheet(); render();
  try { await run('កំពុងផ្លាស់ទី', () => call('moveBook', id, toId === ROOT_KEY ? '' : toId));
        toast('បានផ្លាស់ទៅ “' + (toId===ROOT_KEY?'លើតុ':LIB.shelves.find(s=>s.id===toId).name) + '” ✓'); }
  catch(e){ load(); }
}

/* ---------- Shelf menu ---------- */
let uploadTarget = null;
function shelfSheet(id){
  const s = allShelves().find(x => x.id === id); if (!s) return;
  const idx = LIB.shelves.indexOf(s);
  openSheet(`<h3 class="h2">${esc(s.name)}</h3>
    <div class="mlist">
      ${s.virtual ? '' : `<button class="btn" data-a="add">${I.plus}បន្ថែមសៀវភៅ (Upload)</button>
      <button class="btn" data-a="ren">${I.edit}ប្ដូរឈ្មោះធ្នើ</button>
      <button class="btn" data-a="up" ${idx<=0?'disabled style="opacity:.4"':''}>${I.up}រំកិលធ្នើឡើងលើ</button>
      <button class="btn" data-a="down" ${idx>=LIB.shelves.length-1?'disabled style="opacity:.4"':''}>${I.down}រំកិលធ្នើចុះក្រោម</button>`}
      ${s.url && s.url!=='#' ? `<a class="btn" style="text-decoration:none" href="${s.url}" target="_blank">${I.drive}បើក Folder ក្នុង Drive</a>` : ''}
      ${s.virtual ? '' : `<button class="btn red" data-a="del">${I.del}លុបធ្នើ</button>`}
    </div>`);
  const on = (a, f) => { const el = $('#sheet').querySelector(`[data-a=${a}]`); if (el) el.onclick = f; };
  on('add', () => { uploadTarget = id; closeSheet(); $('#fileIn').click(); });
  on('ren', async () => {
    const v = await ask({title:'ប្ដូរឈ្មោះធ្នើ', label:'ឈ្មោះថ្មី (Folder ក្នុង Drive ក៏ប្ដូរដែរ)', value:s.name});
    if (!v || v === s.name) return;
    const old = s.name; s.name = v; render();
    try { await run('កំពុងប្ដូរឈ្មោះធ្នើ', () => call('renameShelf', id, v)); toast('បានប្ដូរឈ្មោះធ្នើ ✓'); }
    catch(e){ s.name = old; render(); }
  });
  on('up',   () => reorder(id, -1));
  on('down', () => reorder(id, +1));
  on('del', async () => {
    const others = LIB.shelves.filter(x => x.id !== id);
    const extra = s.books.length ? `<p class="note">ធ្នើនេះមានសៀវភៅ ${kmNum(s.books.length)} ក្បាល។ តើចង់ធ្វើអ្វីជាមួយសៀវភៅទាំងនោះ?</p>
        <select class="inp" id="askSel" style="margin-top:10px">
          ${others.map(o=>`<option value="${o.id}">ផ្លាស់ទៅធ្នើ “${esc(o.name)}”</option>`).join('')}
          <option value="__trash">លុបទាំងអស់ (ទៅ Trash ក្នុង Drive)</option></select>`
      : `<p class="note">Folder “${esc(s.name)}” នឹងទៅ Trash ក្នុង Google Drive។</p>`;
    const r = await ask({title:'លុបធ្នើ “'+s.name+'”?', ok:'លុបធ្នើ', danger:true, extra});
    if (!r) return;
    const to = r.sel && r.sel !== '__trash' ? r.sel : '';
    const snapshot = JSON.stringify(LIB);
    if (to){ const d = LIB.shelves.find(x=>x.id===to); d.books.push(...s.books); d.books.sort((a,c)=>a.name.localeCompare(c.name)); }
    LIB.shelves = others; render();
    try { await run('កំពុងលុបធ្នើ', () => call('deleteShelf', id, to)); toast('បានលុបធ្នើ ✓'); }
    catch(e){ LIB = JSON.parse(snapshot); render(); }
  });
}
async function reorder(id, dir){
  const i = LIB.shelves.findIndex(s => s.id === id), j = i + dir;
  if (j < 0 || j >= LIB.shelves.length) return;
  [LIB.shelves[i], LIB.shelves[j]] = [LIB.shelves[j], LIB.shelves[i]];
  closeSheet(); render();
  document.querySelector(`[data-shelf="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
  try { await run('កំពុងរក្សាលំដាប់', () => call('saveShelfOrder', LIB.shelves.map(s => s.id))); } catch(e){}
}

/* ---------- Upload ---------- */
$('#fileIn').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const s = LIB.shelves.find(x => x.id === uploadTarget); if (!s || !files.length) return;
  for (const f of files){
    if (f.size > 30*1048576){ toast(`“${f.name}” ធំជាង 30MB — សូម Upload ផ្ទាល់ក្នុង Drive`, true); continue; }
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
    try {
      const nb = await run(`កំពុង Upload ${f.name}`, () => call('uploadBook', s.id, f.name, f.type || 'application/pdf', b64));
      s.books.push(nb); s.books.sort((a,c)=>a.name.localeCompare(c.name)); render(); toast('បានបន្ថែម ✓');
    } catch(e){}
  }
});

/* ===================== Events ===================== */
document.addEventListener('click', e => {
  const ux = e.target.closest('[data-unread]');
  if (ux){ e.preventDefault(); e.stopPropagation(); return markReading(ux.dataset.unread, false); }
  const rd = e.target.closest('[data-read]');
  if (rd){ const id = rd.dataset.read; if (readingIds()[0] !== id) setTimeout(() => markReading(id, true), 300); return; }
  const hb = e.target.closest('[data-hero]'); if (hb) return bookSheet(hb.dataset.hero);
  const bk = e.target.closest('.books .book'); if (bk) return bookSheet(bk.dataset.book);
  const mo = e.target.closest('[data-more]');
  if (mo){ const id = mo.dataset.more; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); saveSets(); layoutRows();
           if (!OPEN.has(id)) mo.closest('.shelf').scrollIntoView({behavior:'smooth', block:'nearest'}); return; }
  const pl = e.target.closest('[data-plate]');
  if (pl){ const id = pl.dataset.plate; CLOSED.has(id) ? CLOSED.delete(id) : CLOSED.add(id); saveSets(); layoutRows(); return; }
  const mn = e.target.closest('[data-menu]'); if (mn) return shelfSheet(mn.dataset.menu);
});
$('#bSync').onclick = () => { if (!busy) load(); };
$('#bSearch').onclick = () => { const b = $('#searchBox'); b.classList.toggle('on'); if (b.classList.contains('on')) $('#q').focus(); else { $('#q').value=''; applySearch(); } };
$('#q').addEventListener('input', () => {
  applySearch();
  const first = document.querySelector('.book.hit'); if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
});
$('#bAdd').onclick = async () => {
  const v = await ask({title:'បន្ថែមធ្នើថ្មី', label:'ឈ្មោះធ្នើ (នឹងបង្កើតជា Folder ក្នុង Drive)', ok:'បង្កើត'});
  if (!v) return;
  try { const s = await run('កំពុងបង្កើតធ្នើ', () => call('addShelf', v)); LIB.shelves.push(s); render();
        document.querySelector(`[data-shelf="${s.id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'}); toast('បានបង្កើតធ្នើ ✓'); } catch(e){}
};

/* Drag & drop (កុំព្យូទ័រ): អូសសៀវភៅទៅធ្នើផ្សេង */
let dragId = null;
document.addEventListener('dragstart', e => { const b = e.target.closest('.book'); if (!b) return; dragId = b.dataset.book; b.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
document.addEventListener('dragend',   e => { document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop')); dragId = null; });
document.addEventListener('dragover',  e => { const s = e.target.closest('.shelf'); if (!s || !dragId) return; e.preventDefault();
  document.querySelectorAll('.shelf.drop').forEach(x => x !== s && x.classList.remove('drop')); s.classList.add('drop'); });
document.addEventListener('drop', e => { const s = e.target.closest('.shelf'); if (!s || !dragId) return; e.preventDefault(); moveBook(dragId, s.dataset.shelf); });

/* ===================== Start ===================== */
$('#logo').src = document.getElementById('appIcon').href;
if (MODE === 'demo') $('#demoBar').hidden = false;
load();
</script>
</body>
</html>

<style>
/* =====================================================================
   Bookshelf · សៀវភៅជាសិរី — Modern theme
   ===================================================================== */
:root{
  --bg:#f6f2eb; --bg-2:#eee7da; --card:#ffffff; --line:rgba(45,32,18,.10); --line-2:rgba(45,32,18,.18);
  --text:#1d1a16; --muted:#7b7064; --accent:#1f4d43; --accent-2:#2f6b5c; --on-accent:#fff;
  --gold:#c9973f; --gold-hi:#e7c27e; --danger:#b83a2b; --ribbon:#c2412d;
  --glass:rgba(246,242,235,.78);
  --pk-hi:#fff7ea; --pk-1:#ead6b4; --pk-2:#d4b488; --pk-edge:#b38c5c; --pk-shadow:rgba(70,45,20,.22);
  --cover-shadow:0 1px 1px rgba(0,0,0,.06), 0 4px 6px -2px rgba(40,24,10,.22), 0 14px 22px -10px rgba(40,24,10,.45);

  --cw: clamp(48px, calc((100vw - 72px) / 5.6), 92px);
  --ch: calc(var(--cw) * 1.48);
  --plank: 22px;
  --row: calc(var(--ch) + var(--plank) + 16px);
  --gap: clamp(10px, 2.4vw, 18px);
  --radius: 18px;
}
@media (min-width:900px){ :root{ --cw: clamp(76px, calc((100vw - 200px) / 11), 104px); } }
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121513; --bg-2:#1b201e; --card:#1d2220; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --text:#f1ece3; --muted:#9c9d95; --accent:#e7c27e; --accent-2:#f3d79f; --on-accent:#1a1610;
    --glass:rgba(18,21,19,.78);
    --pk-hi:#9a7350; --pk-1:#7a5536; --pk-2:#5c3e26; --pk-edge:#3e2817; --pk-shadow:rgba(0,0,0,.5);
    --cover-shadow:0 1px 1px rgba(0,0,0,.3), 0 4px 6px -2px rgba(0,0,0,.4), 0 14px 22px -10px rgba(0,0,0,.7);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Noto Sans Khmer',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(48px + env(safe-area-inset-bottom));
  background:radial-gradient(1100px 520px at 85% -10%, rgba(201,151,63,.10), transparent 60%),
             radial-gradient(900px 480px at -10% 0%, rgba(31,77,67,.08), transparent 60%), var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap,.hero,.reading,.cabinet,.foot,.demo,.hrow,.search{max-width:1200px;margin-left:auto;margin-right:auto}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:22.5%;flex:none;display:block;box-shadow:0 2px 6px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;line-height:1.05;letter-spacing:.2px;color:var(--text)}
.brand .motto{display:inline-block;margin-left:8px;font-family:'Noto Serif Khmer',serif;font-weight:600;font-size:12.5px;color:var(--gold);vertical-align:3px}
.brand small{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3fae6a;margin-right:6px;vertical-align:middle}
.dot.busy{background:var(--gold);animation:pulse 1s infinite}
.dot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:.15s}
.ibtn:hover{color:var(--accent);border-color:var(--line-2)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:19px;height:19px}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.search{margin-top:10px;display:none}
.search.on{display:block}
.search input{width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.demo{padding:0 16px;margin-top:12px}
.demo div{font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:12px;padding:8px 12px;text-align:center}

/* ---------- Hero: សៀវភៅដើរ ---------- */
.hero{margin-top:18px;padding:0 16px;--hw:calc(var(--cw) * .9)}
.hero:empty,.reading:empty{display:none}
.hero-in{position:relative;overflow:hidden;border-radius:26px;color:#fff;
  background:
    radial-gradient(700px 260px at 80% 0%, rgba(231,194,126,.30), transparent 65%),
    radial-gradient(500px 300px at 0% 100%, rgba(47,107,92,.55), transparent 70%),
    linear-gradient(135deg,#1f4d43,#163a32 55%,#0d241f);
  box-shadow:0 20px 40px -18px rgba(15,42,36,.55)}
.hero-cap{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:20px 22px 0}
.hero-cap h2{margin:0;font-family:'Noto Serif Khmer',serif;font-weight:700;font-size:20px;line-height:1.6;color:#fff8ea}
.hero-cap span{font-size:12px;color:rgba(255,248,234,.7);white-space:nowrap;padding-bottom:6px}
.track{position:relative;overflow:hidden;padding-top:18px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq{display:flex;width:max-content;animation:marq var(--dur,60s) linear infinite}
.hero-in:hover .marq{animation-play-state:paused}
@keyframes marq{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.mbook{--cw:var(--hw);flex:none;width:var(--hw);margin-right:calc(var(--gap) + 4px);display:block;padding:0}
.mbook .cover{height:calc(var(--hw) * 1.48);animation:bob 1.6s ease-in-out infinite alternate;animation-delay:var(--d,0s);
  box-shadow:0 2px 3px rgba(0,0,0,.25),0 16px 24px -10px rgba(0,0,0,.6)}
.mbook:hover .cover{transform:translateY(-10px) scale(1.04);animation-play-state:paused}
@keyframes bob{from{transform:translateY(0) rotate(-.8deg)}to{transform:translateY(-5px) rotate(.8deg)}}
.rail{height:14px;margin:0 14px 18px;border-radius:0 0 8px 8px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22) 3px,rgba(255,255,255,.10) 10px,rgba(255,255,255,.04));
  box-shadow:0 10px 16px -8px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){.marq,.mbook .cover{animation:none}}

/* ---------- Section heading ---------- */
.sec-h{display:flex;align-items:center;gap:10px;margin:0 4px 14px;font-family:'Noto Serif Khmer',serif;font-weight:700;font-size:19px;color:var(--text)}
.sec-h svg{width:20px;height:20px;flex:none;color:var(--gold)}
.sec-h b{font-family:'Noto Sans Khmer',sans-serif;font-weight:500;font-size:12px;color:var(--muted);background:var(--bg-2);padding:2px 9px;border-radius:999px}
.sec-h b:empty{display:none}

/* ---------- កំពុងអាន ---------- */
.reading{margin-top:30px;padding:0 16px;--rw:calc(var(--cw) * 1.15)}
.rlist{display:flex;gap:18px;overflow-x:auto;padding:10px 4px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rlist::-webkit-scrollbar{display:none}
.ritem{--cw:var(--rw);flex:none;position:relative;width:var(--rw);scroll-snap-align:start;text-decoration:none;color:inherit}
.ritem .cover{height:calc(var(--rw) * 1.48)}
.ritem:hover .cover{transform:translateY(-5px)}
.ritem .t{font-size:12.5px;font-weight:500;line-height:1.55;margin-top:10px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .x{position:absolute;top:-8px;right:-8px;z-index:5;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line-2);color:var(--muted);font-size:14px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ritem .x:hover{color:var(--danger)}
.ritem .bm{position:absolute;top:-4px;right:14px;z-index:4;width:12px;height:24px;background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.rempty{margin:0 4px;padding:18px;border-radius:16px;border:1px dashed var(--line-2);color:var(--muted);font-size:13px;text-align:center;line-height:1.8;background:color-mix(in srgb,var(--card) 55%,transparent)}

/* ---------- Bookcase ---------- */
.cabinet{margin-top:34px;padding:0 16px}
.crown,.plinth{display:none}
.frame{padding:0}
.shelf{position:relative;margin-bottom:30px}
.shelf.drop{outline:2px dashed var(--accent);outline-offset:6px;border-radius:12px}
.plate-row{display:flex;align-items:center;padding:0 48px 10px 4px;position:relative}
.plate{display:inline-flex;align-items:center;gap:10px;max-width:100%;cursor:pointer;user-select:none;
  font-family:'Noto Serif Khmer',serif;font-weight:700;font-size:19px;line-height:1.7;color:var(--text)}
.plate span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate b{font-family:'Noto Sans Khmer',sans-serif;font-weight:500;font-size:12px;color:var(--muted);background:var(--bg-2);padding:2px 9px;border-radius:999px;line-height:1.6}
.plate .chev{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .2s}
.shelf.closed .plate .chev{transform:rotate(-90deg)}
.smenu{position:absolute;right:0;top:2px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);background:transparent;border:1px solid transparent;transition:.15s}
.smenu:hover{background:var(--card);border-color:var(--line);color:var(--text)}
.smenu svg{width:18px;height:18px}

.books{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:var(--gap);
  padding:0 clamp(14px,3vw,28px);min-height:var(--row);
  background:repeating-linear-gradient(180deg,
    transparent 0, transparent calc(var(--row) - var(--plank)),
    var(--pk-hi) calc(var(--row) - var(--plank)),
    var(--pk-1) calc(var(--row) - var(--plank) + 2px),
    var(--pk-2) calc(var(--row) - var(--plank) + 10px),
    var(--pk-edge) calc(var(--row) - var(--plank) + 11px),
    var(--pk-shadow) calc(var(--row) - var(--plank) + 12px),
    transparent var(--row));
  border-radius:4px}
.shelf.closed .books{display:none}
.shelf.closed::after{content:"";display:block;height:var(--plank);margin-top:2px;
  background:linear-gradient(180deg,var(--pk-hi),var(--pk-1) 2px,var(--pk-2) 10px,var(--pk-edge) 11px,var(--pk-shadow) 12px,transparent);border-radius:4px}
.shelf.closed .plate-row{padding-bottom:4px}
.empty{width:100%;height:var(--row);display:grid;place-items:center;padding-bottom:var(--plank);color:var(--muted);font-size:13px}

/* ---------- Book ---------- */
.book{position:relative;width:var(--cw);height:var(--row);padding:16px 0 var(--plank);display:flex;align-items:flex-end}
.cover{position:relative;width:100%;height:var(--ch);border-radius:3px 7px 7px 3px;overflow:hidden;
  background:var(--bg-2);box-shadow:var(--cover-shadow);
  transition:transform .3s cubic-bezier(.2,.8,.3,1.15), box-shadow .3s; transform-origin:bottom center}
.cover::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg, rgba(0,0,0,.28) 0, rgba(255,255,255,.30) 2px, rgba(0,0,0,.12) 5px, transparent 10px, transparent 92%, rgba(0,0,0,.06)),
             linear-gradient(180deg, rgba(255,255,255,.10), transparent 30%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.cover img.ok{opacity:1}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-8px);box-shadow:0 2px 2px rgba(0,0,0,.08),0 22px 30px -12px rgba(40,24,10,.55)}
.book:active .cover{transform:translateY(-4px) scale(.98)}
.book:focus-visible{outline:none}
.book.dim{opacity:.2;filter:grayscale(.8)}
.book.hit .cover{box-shadow:0 0 0 3px var(--accent),0 14px 24px -10px rgba(0,0,0,.5)}
.book.dragging{opacity:.35}
.book.over{display:none}

/* fallback cover (គ្មានរូប) */
.leather{position:absolute;inset:0;
  background:radial-gradient(120% 70% at 20% 10%, rgba(255,255,255,.18), transparent 55%),
             linear-gradient(160deg, color-mix(in srgb,var(--lc) 85%,#fff), var(--lc) 45%, color-mix(in srgb,var(--lc) 75%,#000));
  box-shadow:inset 0 0 0 7px transparent, inset 0 0 0 8px rgba(255,255,255,.18)}
.leather i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;
  color:rgba(255,240,210,.85);font-size:calc(var(--cw) * .28);font-family:'Cormorant Garamond',serif}
.leather u{position:absolute;left:30%;right:30%;height:1px;background:rgba(255,240,210,.55);text-decoration:none}
.leather u:nth-of-type(1){top:30%} .leather u:nth-of-type(2){bottom:30%}
.ext{position:absolute;right:4px;bottom:4px;z-index:3;font:600 8.5px/1 'Noto Sans Khmer',sans-serif;letter-spacing:.4px;
  color:#fff;background:rgba(0,0,0,.5);padding:3px 4px;border-radius:4px;text-transform:uppercase;backdrop-filter:blur(4px)}

/* +N tile */
.more{width:var(--cw);height:var(--row);padding:16px 0 var(--plank);display:flex;align-items:flex-end}
.more[hidden]{display:none}
.more span{width:100%;height:var(--ch);display:grid;place-items:center;align-content:center;gap:4px;border-radius:8px;
  border:1.5px dashed var(--line-2);background:color-mix(in srgb,var(--card) 60%,transparent);color:var(--accent);transition:.2s}
.more b{font:700 calc(var(--cw) * .30)/1 'Cormorant Garamond',serif}
.more small{font-size:10.5px;color:var(--muted);line-height:1.4;text-align:center;padding:0 4px}
.more:hover span{border-color:var(--accent);background:var(--card)}

/* ---------- Sheet ---------- */
.veil{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom));background:var(--card);color:var(--text);
  box-shadow:0 -12px 40px rgba(0,0,0,.25);transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.veil.on .sheet{transform:none}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:26px}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:-4px auto 16px}
.bk-head{display:flex;gap:16px;align-items:flex-start}
.bk-head .cover{width:96px;height:142px;flex:none;--cw:96px}
.bk-title{font-family:'Noto Serif Khmer',serif;font-weight:700;font-size:17px;line-height:1.6;color:var(--text);word-break:break-word;margin:2px 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.9}
.meta .mono{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11.5px}
.h2{font-family:'Noto Serif Khmer',serif;font-weight:700;font-size:18px;color:var(--text);margin:0 0 14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;
  background:var(--bg-2);border:1px solid transparent;color:var(--text);transition:.15s}
.btn:hover{border-color:var(--line-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn.gold{background:var(--accent);color:var(--on-accent);font-weight:600;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.red{color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.btn.full{grid-column:1/-1}
.btn:active{transform:scale(.98)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:16px 0 6px}
.inp,select.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);
  background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist .btn{justify-content:flex-start}
.note{font-size:13px;color:var(--muted);line-height:1.75;margin:4px 0 0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;
  padding:11px 18px;border-radius:999px;background:#1d1a16;color:#fff;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.3);
  opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger)}

.loading{padding:70px 0;text-align:center;color:var(--muted)}
.loading .bk{display:inline-flex;gap:6px;margin-bottom:14px}
.loading .bk i{width:13px;height:40px;border-radius:3px;background:var(--accent);animation:lean 1.2s infinite ease-in-out}
.loading .bk i:nth-child(2){background:var(--gold);animation-delay:.12s}.loading .bk i:nth-child(3){background:var(--ribbon);animation-delay:.24s}
.loading .bk i:nth-child(4){background:var(--accent-2);animation-delay:.36s}
@keyframes lean{50%{transform:rotate(-12deg) translateY(-3px)}}
.foot{margin-top:10px;padding:0 16px;font-size:12px;color:var(--muted);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <img class="logo" id="logo" alt="Bookshelf logo" width="46" height="46">
    <div class="brand">
      <h1>Bookshelf <span class="motto">សៀវភៅជាសិរី</span></h1>
      <small id="status"><span class="dot busy"></span>កំពុងភ្ជាប់ជាមួយ Drive…</small>
    </div>
    <button class="ibtn" id="bSearch" title="ស្វែងរក" aria-label="ស្វែងរក"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ibtn" id="bAdd" title="បន្ថែមធ្នើ" aria-label="បន្ថែមធ្នើ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 19h18M5 19V9m14 10V9M3 9h18M12 3v4m-2-2h4"/></svg></button>
    <button class="ibtn" id="bSync" title="Sync ឡើងវិញ" aria-label="Sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg></button>
  </div>
  <div class="search" id="searchBox"><input id="q" type="search" placeholder="ស្វែងរកសៀវភៅ…" autocomplete="off"></div>
</header>

<div class="demo" id="demoBar" hidden><div>របៀបបង្ហាញគំរូ — ពេលដំណើរការក្នុង Apps Script នឹងបង្ហាញសៀវភៅពិតពី Drive</div></div>

<section class="hero" id="hero"></section>
<section class="reading" id="reading"></section>
<main class="cabinet" id="cab">
  <div class="loading"><div class="bk"><i></i><i></i><i></i><i></i></div><div>កំពុងរៀបចំធ្នើ…</div></div>
</main>
<div class="foot" id="foot"></div>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" multiple accept=".pdf,.epub,.doc,.docx,.ppt,.pptx,.txt,image/*" hidden>

<script>
/* ===================== API (Apps Script Web App) ===================== */
const API_URL   = 'https://script.google.com/macros/s/AKfycbyrYHhMtFKSSmIwLnPmY7OT0b43tXLpLryDFsIcoos6Ukw5Yzny6R-AY7X9NG-rB863/exec';
const API_TOKEN = 'KEP-07e5635801f1a62e3f049edc';   // ត្រូវដូចគ្នានឹង Code.gs
const ROOT_KEY = '__root';

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const MODE = IN_GAS ? 'gas' : (/[?&]demo\b/.test(location.search) ? 'demo' : 'api');

function call(fn, ...args){
  if (MODE === 'demo') return DEMO[fn](...args);
  if (MODE === 'gas')
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
  return fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },      // គ្មាន CORS preflight
      body: JSON.stringify({ token: API_TOKEN, action: fn, args })
    })
    .catch(() => { throw new Error('ភ្ជាប់មិនបាន — សូមពិនិត្យ Internet ឬកំណត់ Web app “Who has access” = Anyone'); })
    .then(r => r.text())
    .then(t => {
      let j; try { j = JSON.parse(t); }
      catch(e){ throw new Error('Web app មិនឆ្លើយ JSON — សូម Deploy “New version” ហើយកំណត់ Who has access = Anyone'); }
      if (!j.ok) throw new Error(j.error);
      return j.data;
    });
}

/* ---------- Demo data (preview only) ---------- */
const DEMO = (() => {
  const mk = (names) => names.map((n,i) => ({ id:'d'+Math.random().toString(36).slice(2,9), name:n, mime:'application/pdf',
    size: (1+i*3.7)*1048576|0, updated:new Date(Date.now()-i*864e5*9).toISOString(), url:'#' }));
  let lib = { rootUrl:'#', rootName:'Books', loose:[], reading:[], shelves:[
    { id:'s1', name:'Dental Books', url:'#', books: mk(['Essensail Orthodontic.pdf','Emerging Nanotechnologies in Dentistry.pdf','How to become a unique dentist.pdf','Treat.pdf','Lasers in Maxillofacial Surgery and Dentistry.pdf','Endodontics Principles.pdf','Oral Pathology Atlas.pdf','Periodontology Handbook.pdf','Pediatric Dentistry.pdf']) },
    { id:'s2', name:'EBooks', url:'#', books: mk(['Atomic Habits.pdf','Deep Work.epub','The Psychology of Money.pdf','Thinking Fast and Slow.pdf','Sapiens.pdf']) },
    { id:'s3', name:'ធម្មសិក្សា', url:'#', books: mk(['ធម្មបទ.pdf','មង្គលសូត្រ.pdf','វិបស្សនា.pdf']) },
    { id:'s4', name:'ឯកសារ', url:'#', books: mk(['របាយការណ៍ប្រចាំឆ្នាំ.pdf','សេចក្ដីណែនាំ.docx']) },
    { id:'s5', name:'ឯកសារ-រដ្ឋបាល', url:'#', books: [] }
  ]};
  const wait = (v) => new Promise(r => setTimeout(() => r(v), 250));
  const findBook = id => { for (const s of [...lib.shelves,{id:ROOT_KEY,books:lib.loose}]) { const i=s.books.findIndex(b=>b.id===id); if(i>-1) return [s,i]; } };
  return {
    getLibrary: () => wait(JSON.parse(JSON.stringify({...lib, syncedAt:new Date().toISOString()}))),
    getCovers: ids => wait(Object.fromEntries(ids.map(i=>[i,null]))),
    addShelf: n => { const s={id:'s'+Date.now(),name:n,books:[],url:'#'}; lib.shelves.push(s); return wait({...s}); },
    renameShelf: (id,n) => { lib.shelves.find(s=>s.id===id).name=n; return wait(true); },
    deleteShelf: (id,to) => { const s=lib.shelves.find(x=>x.id===id); if(to) lib.shelves.find(x=>x.id===to).books.push(...s.books); lib.shelves=lib.shelves.filter(x=>x.id!==id); return wait(true); },
    saveShelfOrder: ids => { lib.shelves.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); return wait(true); },
    renameBook: (id,n) => { const [s,i]=findBook(id); s.books[i].name=n; return wait(true); },
    moveBook: (id,to) => { const [s,i]=findBook(id); const [b]=s.books.splice(i,1); (to?lib.shelves.find(x=>x.id===to).books:lib.loose).push(b); return wait(true); },
    deleteBook: id => { const [s,i]=findBook(id); s.books.splice(i,1); return wait(true); },
    setReading: (id,on) => { lib.reading = lib.reading.filter(x=>x!==id); if (on) lib.reading.unshift(id); return wait([...lib.reading]); },
    uploadBook: (sid,n,m) => { const b={id:'u'+Date.now(),name:n,mime:m,size:0,updated:new Date().toISOString(),url:'#'}; lib.shelves.find(x=>x.id===sid).books.push(b); return wait({...b}); }
  };
})();

/* ===================== State ===================== */
let LIB = null;           // { shelves:[], loose:[] }
let busy = 0;
const covers = new Map(); // id -> dataURL | null
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baseName = n => n.replace(/\.[a-z0-9]{2,5}$/i,'');
const extOf = n => (n.match(/\.([a-z0-9]{2,5})$/i)||[])[1] || '';
const fmtSize = b => !b ? '—' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB';
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const kmNum = n => String(n).replace(/\d/g, d => '០១២៣៤៥៦៧៨៩'[d]);

const LEATHER = ['#1f4d43','#7a3b2e','#2d4a6b','#8a6a2f','#4b3b5e','#355e3b','#5b4636','#2f5f66','#8c4a3c','#3b3f46'];
function hash(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
const allShelves = () => LIB ? [...LIB.shelves, ...(LIB.loose.length ? [{id:ROOT_KEY,name:'លើតុ — មិនទាន់ដាក់ធ្នើ',books:LIB.loose,virtual:true}] : [])] : [];
const shelfOf = id => allShelves().find(s => s.books.some(b => b.id === id));
const bookById = id => { for (const s of allShelves()) { const b = s.books.find(x => x.id === id); if (b) return b; } };

function setStatus(kind, text){
  $('#status').innerHTML = `<span class="dot ${kind}"></span>${esc(text)}`;
}
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2600);
}
async function run(label, fn){
  busy++; setStatus('busy', label + '…'); $('#bSync').classList.add('spin');
  try { const r = await fn(); return r; }
  catch(e){ toast('មានបញ្ហា: ' + (e && e.message || e), true); setStatus('err','Sync មិនបានសម្រេច'); throw e; }
  finally { if (--busy === 0) { $('#bSync').classList.remove('spin'); stamp(); } }
}
function stamp(){
  if (!LIB) return;
  const n = allShelves().reduce((a,s)=>a+s.books.length,0);
  setStatus('', `${kmNum(LIB.shelves.length)} ធ្នើ · ${kmNum(n)} ក្បាល · Sync ${new Date(LIB.syncedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
}

/* ===================== Render ===================== */
function coverHTML(b){
  const c = covers.get(b.id);
  const lc = LEATHER[hash(b.name) % LEATHER.length];

/* ---------- Lazy cover loading ---------- */
let io, queue = new Set(), inflight = 0;
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
function observeCovers(){
  if (io) io.disconnect();
  io = new IntersectionObserver(ents => {
    ents.forEach(e => { if (!e.isIntersecting) return;
      const id = e.target.dataset.cv; io.unobserve(e.target);
      if (covers.has(id)) return;
      const cached = LS.get('cv3_' + id);
      if (cached !== null){ covers.set(id, cached || null); paintCover(id); return; }
      queue.add(id); });
    pump();
  }, { rootMargin: '300px' });
  document.querySelectorAll('.books [data-cv], #hero [data-cv], #reading [data-cv]').forEach(el => io.observe(el));
}
async function pump(){
  while (queue.size && inflight < 3){
    const ids = [...queue].slice(0, 4); ids.forEach(i => queue.delete(i)); inflight++;
    call('getCovers', ids).then(res => {
      ids.forEach(id => { const d = res[id] || null; covers.set(id, d); if (d && d.length < 120000) LS.set('cv3_'+id, d); paintCover(id); });
    }).catch(()=>{}).finally(() => { inflight--; pump(); });
  }
}
function paintCover(id){
  const d = covers.get(id); if (!d) return;
  document.querySelectorAll(`[data-cv="${id}"]`).forEach(el => {
    if (el.querySelector('img')) return;
    const img = new Image(); img.alt=''; img.onload = () => img.classList.add('ok'); img.src = d; el.appendChild(img);
  });
}

function applySearch(){
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('.book').forEach(el => {
    const b = bookById(el.dataset.book); if (!b) return;
    const m = q && b.name.toLowerCase().includes(q);
    el.classList.toggle('dim', !!q && !m); el.classList.toggle('hit', !!m);
  });
  layoutRows();
}

/* ---------- ២ ជួរ / លាក់ធ្នើ ---------- */
const loadSet = k => { try { return new Set(JSON.parse(LS.get(k) || '[]')); } catch(e){ return new Set(); } };
const OPEN = loadSet('shelfOpenAll'), CLOSED = loadSet('shelfClosed');
const saveSets = () => { LS.set('shelfOpenAll', JSON.stringify([...OPEN])); LS.set('shelfClosed', JSON.stringify([...CLOSED])); };
const MAX_ROWS = 2;

function layoutRows(){
  const searching = !!$('#q').value.trim();
  document.querySelectorAll('.shelf').forEach(sh => {
    const id = sh.dataset.shelf;
    sh.classList.toggle('closed', CLOSED.has(id) && !searching);
    const more = sh.querySelector('.more'); if (!more) return;
    const books = [...sh.querySelectorAll('.book')];
    books.forEach(b => b.classList.remove('over')); more.hidden = true;
    if (sh.classList.contains('closed') || searching || books.length < 2) return;
    const top0 = books[0].offsetTop, per = books.findIndex(b => b.offsetTop !== top0);
    if (per < 1) return;                                   // មានតែ ១ ជួរ
    const limit = per * MAX_ROWS;
    if (books.length <= limit) return;
    more.hidden = false;
    if (OPEN.has(id)){ more.innerHTML = `<span><b>−</b><small>បង្រួម</small></span>`; return; }
    books.slice(limit - 1).forEach(b => b.classList.add('over'));
    more.innerHTML = `<span><b>+${kmNum(books.length - limit + 1)}</b><small>មើលទាំងអស់</small></span>`;
  });
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(layoutRows, 120); });

  $('#mvSel').onchange = e => moveBook(id, e.target.value);

  $('#sheet').querySelector('[data-act=toggleRead]').onclick = () => {

async function moveBook(id, toId){
  const from = shelfOf(id); if (!from || from.id === toId) return;
  const b = bookById(id);
  from.books.splice(from.books.indexOf(b),1);
  const dest = toId === ROOT_KEY ? LIB.loose : LIB.shelves.find(s => s.id === toId).books;
  dest.push(b); dest.sort((a,c)=>a.name.localeCompare(c.name));
  closeSheet(); render();
  try { await run('កំពុងផ្លាស់ទី', () => call('moveBook', id, toId === ROOT_KEY ? '' : toId));
        toast('បានផ្លាស់ទៅ “' + (toId===ROOT_KEY?'លើតុ':LIB.shelves.find(s=>s.id===toId).name) + '” ✓'); }
  catch(e){ load(); }
}

function shelfSheet(id){

  on('add', () => { uploadTarget = id; closeSheet(); $('#fileIn').click(); });
  on('ren', async () => {
    const v = await ask({title:'ប្ដូរឈ្មោះធ្នើ', label:'ឈ្មោះថ្មី (Folder ក្នុង Drive ក៏ប្ដូរដែរ)', value:s.name});
    if (!v || v === s.name) return;
    const old = s.name; s.name = v; render();
    try { await run('កំពុងប្ដូរឈ្មោះធ្នើ', () => call('renameShelf', id, v)); toast('បានប្ដូរឈ្មោះធ្នើ ✓'); }
    catch(e){ s.name = old; render(); }
  });
  on('up',   () => reorder(id, -1));
  on('down', () => reorder(id, +1));
  on('del', async () => {
    const others = LIB.shelves.filter(x => x.id !== id);
    const extra = s.books.length ? `<p class="note">ធ្នើនេះមានសៀវភៅ ${kmNum(s.books.length)} ក្បាល។ តើចង់ធ្វើអ្វីជាមួយសៀវភៅទាំងនោះ?</p>
        <select class="inp" id="askSel" style="margin-top:10px">
          ${others.map(o=>`<option value="${o.id}">ផ្លាស់ទៅធ្នើ “${esc(o.name)}”</option>`).join('')}
          <option value="__trash">លុបទាំងអស់ (ទៅ Trash ក្នុង Drive)</option></select>`
      : `<p class="note">Folder “${esc(s.name)}” នឹងទៅ Trash ក្នុង Google Drive។</p>`;

    const to = r.sel && r.sel !== '__trash' ? r.sel : '';

    if (to){ const d = LIB.shelves.find(x=>x.id===to); d.books.push(...s.books); d.books.sort((a,c)=>a.name.localeCompare(c.name)); }
    LIB.shelves = others; render();
    try { await run('កំពុងលុបធ្នើ', () => call('deleteShelf', id, to)); toast('បានលុបធ្នើ ✓'); }
    catch(e){ LIB = JSON.parse(snapshot); render(); }
  });
}
async function reorder(id, dir){
  const i = LIB.shelves.findIndex(s => s.id === id), j = i + dir;
  if (j < 0 || j >= LIB.shelves.length) return;
  [LIB.shelves[i], LIB.shelves[j]] = [LIB.shelves[j], LIB.shelves[i]];
  closeSheet(); render();
  document.querySelector(`[data-shelf="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
  try { await run('កំពុងរក្សាលំដាប់', () => call('saveShelfOrder', LIB.shelves.map(s => s.id))); } catch(e){}
}

/* ---------- Upload ---------- */
$('#fileIn').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const s = LIB.shelves.find(x => x.id === uploadTarget); if (!s || !files.length) return;
  for (const f of files){
    if (f.size > 30*1048576){ toast(`“${f.name}” ធំជាង 30MB — សូម Upload ផ្ទាល់ក្នុង Drive`, true); continue; }
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
    try {
      const nb = await run(`កំពុង Upload ${f.name}`, () => call('uploadBook', s.id, f.name, f.type || 'application/pdf', b64));
      s.books.push(nb); s.books.sort((a,c)=>a.name.localeCompare(c.name)); render(); toast('បានបន្ថែម ✓');
    } catch(e){}
  }
});

/* ===================== Events ===================== */
document.addEventListener('click', e => {
  const ux = e.target.closest('[data-unread]');
  if (ux){ e.preventDefault(); e.stopPropagation(); return markReading(ux.dataset.unread, false); }
  const rd = e.target.closest('[data-read]');
  if (rd){ const id = rd.dataset.read; if (readingIds()[0] !== id) setTimeout(() => markReading(id, true), 300); return; }
  const hb = e.target.closest('[data-hero]'); if (hb) return bookSheet(hb.dataset.hero);
  const bk = e.target.closest('.books .book'); if (bk) return bookSheet(bk.dataset.book);
  const mo = e.target.closest('[data-more]');
  if (mo){ const id = mo.dataset.more; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); saveSets(); layoutRows();
           if (!OPEN.has(id)) mo.closest('.shelf').scrollIntoView({behavior:'smooth', block:'nearest'}); return; }
  const pl = e.target.closest('[data-plate]');
  if (pl){ const id = pl.dataset.plate; CLOSED.has(id) ? CLOSED.delete(id) : CLOSED.add(id); saveSets(); layoutRows(); return; }
  const mn = e.target.closest('[data-menu]'); if (mn) return shelfSheet(mn.dataset.menu);
});
$('#bSync').onclick = () => { if (!busy) load(); };
$('#bSearch').onclick = () => { const b = $('#searchBox'); b.classList.toggle('on'); if (b.classList.contains('on')) $('#q').focus(); else { $('#q').value=''; applySearch(); } };
$('#q').addEventListener('input', () => {
  applySearch();
  const first = document.querySelector('.book.hit'); if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
});
$('#bAdd').onclick = async () => {
  const v = await ask({title:'បន្ថែមធ្នើថ្មី', label:'ឈ្មោះធ្នើ (នឹងបង្កើតជា Folder ក្នុង Drive)', ok:'បង្កើត'});
  if (!v) return;
  try { const s = await run('កំពុងបង្កើតធ្នើ', () => call('addShelf', v)); LIB.shelves.push(s); render();
        document.querySelector(`[data-shelf="${s.id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'}); toast('បានបង្កើតធ្នើ ✓'); } catch(e){}
};

/* Drag & drop (កុំព្យូទ័រ): អូសសៀវភៅទៅធ្នើផ្សេង */
let dragId = null;
document.addEventListener('dragstart', e => { const b = e.target.closest('.book'); if (!b) return; dragId = b.dataset.book; b.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
document.addEventListener('dragend',   e => { document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop')); dragId = null; });
document.addEventListener('dragover',  e => { const s = e.target.closest('.shelf'); if (!s || !dragId) return; e.preventDefault();
  document.querySelectorAll('.shelf.drop').forEach(x => x !== s && x.classList.remove('drop')); s.classList.add('drop'); });
document.addEventListener('drop', e => { const s = e.target.closest('.shelf'); if (!s || !dragId) return; e.preventDefault(); moveBook(dragId, s.dataset.shelf); });

/* ===================== Start ===================== */
$('#logo').src = document.getElementById('appIcon').href;
if (MODE === 'demo') $('#demoBar').hidden = false;
load();
</script>
</body>
</html>
